header:
  schema-version: 1.0.0
  expiration-date: '2027-05-07T10:00:00.000Z'
  last-updated: '2026-05-07'
  last-reviewed: '2026-05-07'
  project-url: https://github.com/natrontech/container-images
  changelog: https://github.com/natrontech/container-images/blob/main/CHANGELOG.md
  license: https://github.com/natrontech/container-images/blob/main/LICENSE
project-lifecycle:
  bug-fixes-only: false
  core-team:
    - name: Jan Fuhrer
      contact: janfuhrer@mailbox.org
    - name: Jan Lauber
      contact: jan.lauber@natron.io
  status: active
contribution-policy:
  accepts-pull-requests: true
  accepts-automated-pull-requests: true
  contributing-policy: https://github.com/natrontech/container-images/blob/main/CONTRIBUTING.md
  code-of-conduct: https://github.com/natrontech/container-images/blob/main/CODE_OF_CONDUCT.md
distribution-points:
  - https://github.com/orgs/natrontech/packages?repo_name=container-images
security-testing:
- tool-type: sca
  tool-name: Dependabot
  tool-version: latest
  integration:
    ad-hoc: false
    ci: true
    before-release: true
  comment: |
    Dependabot is enabled for GitHub Actions and Docker base images.
security-contacts:
- type: email
  value: security@natron.io
  primary: true
vulnerability-reporting:
  accepts-vulnerability-reports: true
  bug-bounty-available: false
  email-contact: security@natron.io
  security-policy: https://github.com/natrontech/container-images/blob/main/SECURITY.md
  comment: |
    Report security vulnerabilities via GitHub Security Advisory in this repository.
dependencies:
  third-party-packages: true
  dependencies-lists:
  - https://github.com/natrontech/container-images/blob/main/nginx-ingress-coraza/Dockerfile
  - https://github.com/natrontech/container-images/blob/main/tcp-forwarder/Dockerfile
  sbom:
  - sbom-format: CycloneDX
    sbom-url: https://github.com/natrontech/container-images/blob/main/SECURITY.md#verify-sbom-attestation
