controller:
  image:
    repository: ghcr.io/natrontech/container-images/nginx-ingress-coraza
    tag: "5.4.3"
    pullPolicy: IfNotPresent

  ingressClass:
    name: nginx-ingress

  # Enables nginx.org/location-snippets and nginx.org/server-snippets annotations
  # on Ingress resources, and location-snippets on VirtualServer routes.
  enableSnippets: true

  config:
    entries:
      # load_module must be in main{} context — the only valid placement
      main-snippets: "load_module modules/ngx_http_coraza_module.so;"
      # Load Coraza rules once globally in the http{} context
      http-snippets: |
        coraza_rules_file /etc/coraza/coraza.conf;
        coraza_rules_file /etc/coraza/coraza-crs-include.conf;
      # Enable WAF in every server{} block by default
      server-snippets: "coraza on;"

  # Mount coraza.conf from a ConfigMap so it can be changed without rebuilding the image.
  # The ConfigMap is defined in manifests/coraza-config.yaml.
  # The mount shadows the baked-in /etc/coraza/coraza.conf with the ConfigMap value.
  #
  # The nginx-tmp emptyDir is required when readOnlyRootFilesystem: true — NGINX writes
  # temporary files to /tmp at runtime. Without this writable volume the pod will crash on startup.
  volumes:
    - name: nginx-tmp
      emptyDir: {}
    - name: custom-templates
      configMap:
        name: coraza-config
    - name: coraza-config
      configMap:
        name: nginx-ingress-coraza-config
  volumeMounts:
    - name: nginx-tmp
      mountPath: /tmp
    - name: custom-templates
      mountPath: /nginx.ingress.tmpl
      subPath: nginx.ingress.tmpl
      readOnly: true
    - name: coraza-config
      mountPath: /etc/coraza/coraza.conf
      subPath: coraza.conf
      readOnly: true

  # Hardened pod and container security context.
  # readOnlyRootFilesystem: true requires the nginx-tmp emptyDir volume above.
  podSecurityContext:
    fsGroup: 101
  securityContext:
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainerSecurityContext:
    capabilities:
      drop:
        - ALL
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

prometheus:
  create: false
