apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo-custom-rules
  namespace: coraza-demo
  annotations:
    # WAF active but with inline rule adjustments for this specific service.
    # Requires -enable-snippets on the NIC controller.
    #
    # coraza_rules runs in the location context and is merged with the
    # global rules loaded via http-snippets. Use it to suppress noisy rules or
    # add service-specific SecRules without touching the shared CRS config.
    nginx.org/location-snippets: |
      coraza_rules "
        # Suppress SQLi rule for the /api/search path where user queries are expected
        SecRule REQUEST_URI \"@beginsWith /api/search\" \
          \"id:9001,phase:1,pass,nolog,ctl:ruleRemoveById=942100\"
        # Suppress anomaly scoring threshold for this low-risk internal service
        SecRule REQUEST_URI \"@beginsWith /internal/\" \
          \"id:9002,phase:1,pass,nolog,ctl:ruleRemoveById=949110\"
      ";
spec:
  ingressClassName: nginx-ingress
  rules:
  - host: coraza-custom.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podinfo
            port:
              number: 9898
