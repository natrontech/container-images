name: Container Build & Publish

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      containers:
        description: 'Comma-separated list of containers to build (leave empty for all)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions: {}

jobs:
  discover-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      containers: ${{ steps.discover.outputs.containers }}
      matrix: ${{ steps.discover.outputs.matrix }}
      versioned_containers: ${{ steps.discover.outputs.versioned_containers }}
      versioned_matrix: ${{ steps.discover.outputs.versioned_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Discover containers
        id: discover
        env:
          INPUT_CONTAINERS: ${{ github.event.inputs.containers }}
        run: |
          set -e

          # Find all directories containing Dockerfiles
          containers=()
          for dir in */; do
            if [[ -f "${dir}Dockerfile" ]]; then
              container_name=$(basename "$dir")
              containers+=("$container_name")
            fi
          done

          # Filter containers if specified in workflow_dispatch
          if [[ -n "$INPUT_CONTAINERS" ]]; then
            IFS=',' read -ra specified_containers <<< "$INPUT_CONTAINERS"
            filtered_containers=()
            for container in "${containers[@]}"; do
              for specified in "${specified_containers[@]}"; do
                specified=$(echo "$specified" | xargs)  # trim whitespace
                if [[ "$container" == "$specified" ]]; then
                  filtered_containers+=("$container")
                  break
                fi
              done
            done
            containers=("${filtered_containers[@]}")
          fi

          echo "Discovered containers: ${containers[*]}"

          # Separate versioned containers (those with a VERSION file)
          versioned_containers=()
          for container in "${containers[@]}"; do
            if [[ -f "${container}/VERSION" ]]; then
              versioned_containers+=("$container")
            fi
          done

          echo "Versioned containers: ${versioned_containers[*]}"

          build_json_array() {
            local -n arr=$1
            local include_platforms=$2
            local json_array matrix
            if [ ${#arr[@]} -eq 0 ]; then
              json_array='[]'
              matrix='{"include":[]}'
            else
              json_array="["
              for i in "${!arr[@]}"; do
                [ $i -gt 0 ] && json_array+=","
                json_array+="\"${arr[$i]}\""
              done
              json_array+="]"

              matrix='{"include":['
              for i in "${!arr[@]}"; do
                [ $i -gt 0 ] && matrix+=","
                container="${arr[$i]}"
                if [[ "$include_platforms" == "true" ]]; then
                  platforms="linux/amd64,linux/arm64"
                  if [[ -f "${container}/PLATFORMS" ]]; then
                    platforms=$(cat "${container}/PLATFORMS" | tr -d '[:space:]')
                  fi
                  matrix+="{\"container\":\"${container}\",\"platforms\":\"${platforms}\"}"
                else
                  matrix+="{\"container\":\"${container}\"}"
                fi
              done
              matrix+=']}'
            fi
            echo "$json_array"
            echo "$matrix"
          }

          { read -r json_array; read -r matrix; } < <(build_json_array containers true)
          { read -r versioned_json_array; read -r versioned_matrix; } < <(build_json_array versioned_containers false)

          echo "containers=${json_array}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "versioned_containers=${versioned_json_array}" >> "$GITHUB_OUTPUT"
          echo "versioned_matrix=${versioned_matrix}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover-containers
    if: needs.discover-containers.outputs.containers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-containers.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read container version
        id: version
        run: |
          VERSION_FILE="./${{ matrix.container }}/VERSION"
          if [[ -f "$VERSION_FILE" ]]; then
            version=$(cat "$VERSION_FILE" | tr -d '[:space:]')
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            # Check the registry: if the tag already exists do not overwrite it.
            # This is the actual immutability enforcement — git history is not reliable
            # (rebase-and-merge PRs with multiple commits can fool a HEAD~1 diff).
            registry_image="ghcr.io/${{ github.repository }}/${{ matrix.container }}"
            if docker manifest inspect "${registry_image}:${version}" > /dev/null 2>&1; then
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
              echo "Tag :${version} already exists in registry — not overwriting"
            else
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
              echo "New version :${version} — will publish"
            fi
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.container }}
          tags: |
            # nightly tag for scheduled builds only
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            # sha tag for push/dispatch only — immutable, never overwritten by nightly
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'schedule' }}
            # version tag from VERSION file — only when VERSION changed in this push
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version_changed == 'true' && github.event_name != 'schedule' }}
            # latest tag for all builds on main branch
            type=raw,value=latest,enable={{is_default_branch}},priority=100
          labels: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.description=Container image for ${{ matrix.container }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./${{ matrix.container }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.container }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container }}
          platforms: ${{ matrix.platforms }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.container }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.container }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign container image
        run: |
          set -euo pipefail
          cosign sign --yes \
            --new-bundle-format \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            -a "container=${{ matrix.container }}" \
            ghcr.io/${{ github.repository }}/${{ matrix.container }}@${{ steps.build.outputs.digest }}

      - name: Attest SBOM
        run: |
          set -euo pipefail
          cosign attest --yes \
            --new-bundle-format \
            --predicate ./${{ matrix.container }}-sbom.cdx.json \
            --type cyclonedx \
            --oidc-provider github-actions \
            ghcr.io/${{ github.repository }}/${{ matrix.container }}@${{ steps.build.outputs.digest }}

      # Digest is pinned to the exact build output — not derived from any tag —
      # so downstream jobs (collect-digests, verify) are not susceptible to
      # tag-overwrite attacks between build and verification.
      - name: Save digest
        run: |
          mkdir -p ./outputs
          echo "${{ steps.build.outputs.digest }}" > "./outputs/${{ matrix.container }}-digest.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.container }}
          path: ./outputs/${{ matrix.container }}-digest.txt
          retention-days: 1

  # Aggregate per-container digests into a single JSON map so the provenance
  # matrix job can index into it: fromJson(digests)[matrix.container]
  collect-digests:
    needs: [discover-containers, build-and-push]
    if: needs.discover-containers.outputs.versioned_containers != '[]' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ./outputs/

      - name: Collect digests into JSON map
        id: collect
        run: |
          set -euo pipefail
          digests='{}'
          for digest_file in ./outputs/*-digest.txt; do
            container=$(basename "$digest_file" -digest.txt)
            digest=$(cat "$digest_file")
            digests=$(echo "$digests" | jq --arg k "$container" --arg v "$digest" '. + {($k): $v}')
          done
          echo "digests=$(echo "$digests" | jq -c)" >> "$GITHUB_OUTPUT"

  # SLSA Level 3 provenance — only for versioned containers (those with a VERSION
  # file), never on nightly. The SLSA generator MUST be referenced by tag.
  # See https://github.com/slsa-framework/slsa-github-generator
  provenance:
    needs: [discover-containers, collect-digests]
    if: needs.discover-containers.outputs.versioned_containers != '[]' && github.event_name != 'schedule'
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-containers.outputs.versioned_matrix) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}/${{ matrix.container }}
      digest: ${{ fromJson(needs.collect-digests.outputs.digests)[matrix.container] }}
      registry-username: ${{ github.actor }}
      provenance-registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
      provenance-registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: [discover-containers, build-and-push, provenance]
    # always() so this runs even when provenance was skipped (non-versioned containers)
    if: always() && needs.discover-containers.outputs.containers != '[]' && github.event_name != 'schedule' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-containers.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download digest artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.container }}
          path: ./outputs/

      - name: Verify signature
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.container }}
        run: |
          set -euo pipefail
          DIGEST=$(cat ./outputs/${{ matrix.container }}-digest.txt)
          cosign verify \
            --new-bundle-format \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/natrontech/container-images/.github/workflows/container-build.yml@refs/heads/main$' \
            $IMAGE@$DIGEST

      - name: Verify SBOM attestation
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.container }}
        run: |
          set -euo pipefail
          DIGEST=$(cat ./outputs/${{ matrix.container }}-digest.txt)
          cosign verify-attestation \
            --new-bundle-format \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/natrontech/container-images/.github/workflows/container-build.yml@refs/heads/main$' \
            --policy policy-sbom.cue \
            $IMAGE@$DIGEST > /dev/null
          echo "SBOM verification successful"

      - name: Check if versioned container
        id: versioned
        run: |
          if [[ -f "./${{ matrix.container }}/VERSION" ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      # Provenance uses the old bundle format (SLSA generator does not support --new-bundle-format)
      - name: Verify SLSA provenance
        if: steps.versioned.outputs.result == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.container }}
        run: |
          set -euo pipefail
          DIGEST=$(cat ./outputs/${{ matrix.container }}-digest.txt)
          cosign verify-attestation \
            --type slsaprovenance \
            --new-bundle-format=false \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+$' \
            --policy policy.cue \
            $IMAGE@$DIGEST
          echo "Provenance verification successful"

  summary:
    needs: [discover-containers, build-and-push]
    if: always() && needs.discover-containers.outputs.containers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Job Summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Containers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          containers='${{ needs.discover-containers.outputs.containers }}'
          echo "$containers" | jq -r '.[] | "- **" + . + "** - `ghcr.io/${{ github.repository }}/" + . + ":latest`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
            echo "All containers built and signed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some containers failed to build. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi
